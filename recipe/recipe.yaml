schema_version: 1

context:
  name: langgraph
  version: "1.2.18"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langgraph-${{ version }}.tar.gz
  sha256: 4c3e4289043ed0f99625a09990a012d7b16bb576301d8616810de7db01725f9e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - pydantic >=2.7.4
    - python-xxhash >=3.5.0
    - langgraph-prebuilt >=1.1.0,<1.2.0
    - langgraph-sdk >=0.4.6,<0.5.0
    - langgraph-checkpoint >=4.3.0,<5.0.0
    - python >=${{ python_min }},<4.0
    - langchain-core >=1.4.7,<2
tests:
  - python:
      imports:
        - langgraph
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: langgraph
  license: MIT
  license_file: LICENSE
  homepage: https://www.github.com/langchain-ai/langgraph

extra:
  recipe-maintainers:
    - jan-janssen
