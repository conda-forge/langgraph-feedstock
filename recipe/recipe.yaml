schema_version: 1

context:
  name: langgraph
  version: "1.2.12"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/langgraph-${{ version }}.tar.gz
  sha256: 5fae9fa4ce771e90f10ff19ce0d5aaef4b41d7632c713d769e89cbce1241a4b9

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - pydantic >=2.7.4
    - python-xxhash >=3.5.0
    - langgraph-prebuilt >=1.1.0,<1.2.0
    - langgraph-sdk >=0.4.2,<0.5.0
    - langgraph-checkpoint >=4.1.0,<5.0.0
    - python >=${{ python_min }},<4.0
    - langchain-core >=1.4.7,<2

tests:
  - python:
      imports:
        - langgraph
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: langgraph
  license: MIT
  license_file: LICENSE
  homepage: https://www.github.com/langchain-ai/langgraph

extra:
  recipe-maintainers:
    - jan-janssen
